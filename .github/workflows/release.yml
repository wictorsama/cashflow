name: Release

# Pushing a version tag (for example v0.1.0) publishes the images and the chart. Nothing is published unless the whole
# CI and security checks pass first.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  publish:
    name: Publish ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushes to GitHub Container Registry with the workflow's own token (no stored secret)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: entries, dockerfile: deploy/docker/entries.Dockerfile, context: . }
          - { service: consolidation, dockerfile: deploy/docker/consolidation.Dockerfile, context: . }
          - { service: assistant, dockerfile: deploy/docker/assistant.Dockerfile, context: . }
          - { service: gateway, dockerfile: deploy/docker/gateway.Dockerfile, context: . }
          - { service: web, dockerfile: deploy/docker/web.Dockerfile, context: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The image carries its build provenance and a software bill of materials (SBOM), so what runs can be traced to
      # this commit and its dependencies can be audited.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/cashflow --version "$version" --app-version "$version" --destination dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
