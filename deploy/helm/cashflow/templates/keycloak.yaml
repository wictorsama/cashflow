apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  cashflow-realm.json: |-
{{ .Files.Get "files/cashflow-realm.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  {{- if .Values.keycloak.nodePort }}
  type: NodePort
  {{- end }}
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if .Values.keycloak.nodePort }}
      nodePort: {{ .Values.keycloak.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{ include "cashflow.labels" (dict "name" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "keycloak") | nindent 8 }}
      annotations:
        checksum/realm: {{ .Files.Get "files/cashflow-realm.json" | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          # Layer 1: development mode with the embedded database; the realm is re-imported on every start.
          args: ["start-dev", "--import-realm"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: keycloak-admin-password } }
            - name: MERCHANT_INTEGRATION_SECRET
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: merchant-integration-secret } }
            - name: OPS_ADMIN_SECRET
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: ops-admin-secret } }
            - name: RECONCILER_SECRET
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: reconciler-secret } }
            - name: AUDITOR_SECRET
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: auditor-secret } }
            - name: AUDITOR1_PASSWORD
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: auditor1-password } }
            - name: MERCHANT1_PASSWORD
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: merchant1-password } }
            # Tokens carry the public address as issuer; services inside the cluster still reach Keycloak by its service name.
            - { name: KC_HOSTNAME, value: {{ .Values.keycloak.publicUrl | quote }} }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          startupProbe:
            httpGet: { path: /health/ready, port: management }
            failureThreshold: 60
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 5
          resources: {{ toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
