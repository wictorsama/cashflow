apiVersion: v1
kind: Secret
metadata:
  name: cashflow-secrets
type: Opaque
stringData:
  postgres-password: {{ required "postgres.password is required" .Values.postgres.password | quote }}
  rabbitmq-password: {{ required "rabbitmq.password is required" .Values.rabbitmq.password | quote }}
  rabbitmq-erlang-cookie: {{ required "rabbitmq.erlangCookie is required" .Values.rabbitmq.erlangCookie | quote }}
  keycloak-admin-password: {{ required "keycloak.adminPassword is required" .Values.keycloak.adminPassword | quote }}
  merchant-integration-secret: {{ required "keycloak.merchantIntegrationSecret is required" .Values.keycloak.merchantIntegrationSecret | quote }}
  ops-admin-secret: {{ required "keycloak.opsAdminSecret is required" .Values.keycloak.opsAdminSecret | quote }}
  reconciler-secret: {{ required "keycloak.reconcilerSecret is required" .Values.keycloak.reconcilerSecret | quote }}
  auditor-secret: {{ required "keycloak.auditorSecret is required" .Values.keycloak.auditorSecret | quote }}
  auditor1-password: {{ required "keycloak.auditor1Password is required" .Values.keycloak.auditor1Password | quote }}
  merchant1-password: {{ required "keycloak.merchant1Password is required" .Values.keycloak.merchant1Password | quote }}
  {{- if .Values.observability.enabled }}
  grafana-admin-password: {{ required "observability.grafana.adminPassword is required" .Values.observability.grafana.adminPassword | quote }}
  {{- end }}
  {{- if .Values.assistant.claude.apiKey }}
  anthropic-api-key: {{ .Values.assistant.claude.apiKey | quote }}
  {{- end }}
  {{- if .Values.external.redis.enabled }}
  redis-connection-string: {{ required "external.redis.connectionString is required" .Values.external.redis.connectionString | quote }}
  {{- end }}
  web-auth-secret: {{ required "web.authSecret is required" .Values.web.authSecret | quote }}
