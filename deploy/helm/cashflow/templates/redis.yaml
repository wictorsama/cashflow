{{- if not .Values.external.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{ include "cashflow.labels" (dict "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # A cache only: no persistence, bounded memory, evicts least recently used.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources: {{ toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
