{{- if .Values.observability.enabled }}
# ---------------------------------------------------------------- Jaeger (traces)
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  {{- if .Values.observability.jaeger.nodePort }}
  type: NodePort
  {{- end }}
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - name: ui
      port: 16686
      targetPort: 16686
      {{- if .Values.observability.jaeger.nodePort }}
      nodePort: {{ .Values.observability.jaeger.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {{ include "cashflow.labels" (dict "name" "jaeger") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "jaeger") | nindent 8 }}
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.observability.jaeger.image }}
          # Layer 1: in-memory storage (traces are lost on restart). The cloud values point it at a real backend.
          ports: [{ containerPort: 4317 }, { containerPort: 16686 }]
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            periodSeconds: 5
          resources: {{ toYaml .Values.observability.jaeger.resources | nindent 12 }}
---
# ---------------------------------------------------------------- Prometheus (metrics, alert rules)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/prometheus-rules.yml
    # Nothing is scraped: the services push their metrics with OTLP (see --web.enable-otlp-receiver).
  prometheus-rules.yml: |-
{{ .Files.Get "files/prometheus-rules.yml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ port: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{ include "cashflow.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get "files/prometheus-rules.yml") "v1" | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-otlp-receiver
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports: [{ containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          resources: {{ toYaml .Values.observability.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: config, mountPath: /etc/prometheus/rules/prometheus-rules.yml, subPath: prometheus-rules.yml }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - { name: data, emptyDir: {} }
---
# ---------------------------------------------------------------- Grafana (dashboards)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true }
      - { name: Jaeger, uid: jaeger, type: jaeger, access: proxy, url: "http://jaeger:16686" }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - { name: cashflow, type: file, options: { path: /var/lib/grafana/dashboards } }
  cashflow-dashboard.json: |-
{{ .Files.Get "files/cashflow-dashboard.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  {{- if .Values.observability.grafana.nodePort }}
  type: NodePort
  {{- end }}
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      {{- if .Values.observability.grafana.nodePort }}
      nodePort: {{ .Values.observability.grafana.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{ include "cashflow.labels" (dict "name" "grafana") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "grafana") | nindent 8 }}
      annotations:
        checksum/dashboard: {{ .Files.Get "files/cashflow-dashboard.json" | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: grafana-admin-password } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
          resources: {{ toYaml .Values.observability.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: provisioning, mountPath: /var/lib/grafana/dashboards/cashflow-dashboard.json, subPath: cashflow-dashboard.json }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - { name: data, emptyDir: {} }
{{- end }}
