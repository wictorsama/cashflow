apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{ include "cashflow.labels" (dict "name" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: {{ include "cashflow.labels" (dict "name" "web") | nindent 8 }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: web }
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ include "cashflow.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          env:
            - { name: AUTH_URL, value: {{ .Values.web.publicUrl | quote }} }
            - { name: AUTH_TRUST_HOST, value: "true" }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: cashflow-secrets, key: web-auth-secret } }
            - { name: KEYCLOAK_CLIENT_ID, value: cashflow-web }
            - { name: KEYCLOAK_ISSUER, value: {{ .Values.auth.issuer | quote }} }
            - { name: KEYCLOAK_INTERNAL_URL, value: "http://keycloak/realms/cashflow" }
            - { name: GATEWAY_URL, value: "http://gateway" }
          startupProbe:
            httpGet: { path: /entrar, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /entrar, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /entrar, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  {{- if .Values.web.nodePort }}
  type: NodePort
  {{- end }}
  selector: { app.kubernetes.io/name: web }
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if .Values.web.nodePort }}
      nodePort: {{ .Values.web.nodePort }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
